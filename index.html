<!DOCTYPE html>
<html>
<head>
    <title>Output Methods</title>
</head>
<body>
    <h2>Different Output Methods</h2>
    <p id="output">this is the output</p>

    <script>
        // 1. document.write()
        document.write("Using document.write()<br>");

        // 2. alert()
        alert("This is an alert box!");

        // 3. console.log()
        console.log("Output in console");

        // 4. innerHTML (assigning new content)
        document.getElementById("output").innerHTML = "Updated using innerHTML";
    </script>
</body>
</html>
